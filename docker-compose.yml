services:
  app:
    build: .
    ports:
      - '3333:3333'
    env_file:
      - .env
    environment:
      - DB_HOST=db
    volumes:
      - uploads_data:/app/public/uploads
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-root}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
      POSTGRES_DB: ${DB_DATABASE:-app}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  uploads_data:
  postgres_data:
